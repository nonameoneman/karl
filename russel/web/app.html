<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Рассел</title>
<style>
:root{
  --bg:#07080c;--text:#eef1f6;--dim:#7d8594;--faint:#3a404c;--glass:rgba(255,255,255,.045);--edge:rgba(255,255,255,.08);
  --accent:#6fd3ff;--warn:#ffb454;--ok:#5fe0a6;
  font-family:"Segoe UI Variable Text","Segoe UI",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);overflow:hidden;user-select:none}
body{display:flex;flex-direction:column;background:radial-gradient(120% 70% at 50% 0%,#0d1320 0%,var(--bg) 60%)}
.top{position:absolute;top:10px;right:12px;display:flex;gap:4px;z-index:5}
.icon{width:34px;height:34px;border-radius:50%;border:0;background:none;color:var(--dim);cursor:pointer;display:grid;place-items:center;transition:.2s}
.icon:hover{background:var(--glass);color:var(--text)}
.icon svg{width:18px;height:18px}
.icon.off{color:var(--warn)}

#stage{flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;transition:flex .6s ease}
body.talking #stage{flex:0 0 190px}
#sky{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:0}
#orb{width:260px;height:260px;border-radius:50%;cursor:pointer;transition:width .6s ease,height .6s ease}
body.talking #orb{width:150px;height:150px}
#stage,#feed,form{position:relative;z-index:1}
#status{height:24px;margin-top:6px;color:var(--dim);font-size:15px;letter-spacing:.01em;text-align:center;transition:opacity .3s}
#hint{height:20px;margin-top:4px;color:var(--faint);font-size:13.5px;text-align:center;transition:opacity .6s}
body.talking #hint{display:none}

#feed{flex:1 1 0;overflow-y:auto;padding:0 22px 12px;scroll-behavior:smooth;mask-image:linear-gradient(transparent 0,#000 28px);user-select:text}
body:not(.talking) #feed{flex:0 0 0;padding:0}
#feed::-webkit-scrollbar{width:6px}#feed::-webkit-scrollbar-thumb{background:var(--faint);border-radius:3px}
.ex{max-width:640px;margin:0 auto;padding:14px 0;transition:opacity .5s}
.ex.old{opacity:.38}
.ex.old:hover{opacity:.8}
.q{color:var(--dim);font-size:14.5px;margin-bottom:8px}
.q .mic{opacity:.6;margin-right:4px}
.a{font-size:18px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word}
.a:empty{display:none}
.act{color:var(--accent);font-size:13.5px;margin:6px 0;opacity:.85;display:flex;align-items:center;gap:8px}
.act::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;animation:blink 1.2s infinite}
.act.done{color:var(--dim);opacity:.6}.act.done::before{animation:none}
@keyframes blink{50%{opacity:.25}}
.card{background:var(--glass);border:1px solid var(--edge);border-radius:16px;padding:16px 18px;margin:12px 0;animation:rise .35s ease}
.card.warn{border-color:rgba(255,180,84,.35)}
.card .t{font-size:16.5px;line-height:1.45;margin-bottom:4px}
.card .s{color:var(--dim);font-size:13.5px;margin-bottom:14px;white-space:pre-wrap;max-height:140px;overflow:auto}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:0;border-radius:999px;padding:10px 22px;font:inherit;font-size:15px;cursor:pointer;background:var(--glass);color:var(--text);border:1px solid var(--edge);transition:.15s}
.btn:hover{background:rgba(255,255,255,.09)}
.btn.main{background:var(--text);color:#0a0c10;border-color:var(--text);font-weight:600}
.btn.main:hover{background:#fff}
.note{color:var(--dim);font-size:13px;text-align:center;margin:10px 0}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}

#undo{position:absolute;left:50%;bottom:88px;transform:translate(-50%,20px);opacity:0;pointer-events:none;transition:.3s;
  background:#1a1f2a;border:1px solid var(--edge);border-radius:999px;padding:8px 8px 8px 18px;display:flex;align-items:center;gap:12px;font-size:14px;z-index:6}
#undo.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#undo .btn{padding:6px 14px;font-size:13.5px}

form{flex:0 0 auto;padding:10px 18px 18px}
.bar{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:6px;background:var(--glass);border:1px solid var(--edge);border-radius:999px;padding:4px 4px 4px 18px;transition:.2s}
.bar:focus-within{border-color:rgba(111,211,255,.35);background:rgba(255,255,255,.06)}
#t{flex:1;border:0;background:none;color:var(--text);font:inherit;font-size:15.5px;padding:10px 0;outline:none;min-width:0}
#t::placeholder{color:var(--faint)}
#send{width:38px;height:38px;border-radius:50%;border:0;background:var(--text);color:#0a0c10;cursor:pointer;display:grid;place-items:center;opacity:0;transform:scale(.6);transition:.2s}
#send.show{opacity:1;transform:none}
#send.stop{background:var(--glass);color:var(--text);opacity:1;transform:none}
#send svg{width:16px;height:16px}

#sheet{position:absolute;inset:0;background:rgba(4,5,8,.6);backdrop-filter:blur(6px);display:none;z-index:10;align-items:flex-end;justify-content:center}
#sheet.show,#meSheet.show{display:flex}
#meSheet{position:absolute;inset:0;background:rgba(4,5,8,.6);backdrop-filter:blur(6px);display:none;z-index:11;align-items:flex-end;justify-content:center}
#meSheet .panel{max-height:88vh;overflow:auto;scrollbar-width:thin;scrollbar-color:var(--faint) transparent}
#meSheet .opt{display:block}#meSheet .opt .voices{margin-top:8px}
#meSheet .sub{color:var(--dim);font-size:13px;margin:-10px 0 14px;line-height:1.45}
#meSheet h4{font-size:12.5px;font-weight:500;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;margin:18px 0 8px}
.tr{display:grid;grid-template-columns:1fr 110px;align-items:center;gap:10px;padding:5px 0;font-size:14.5px}
.tr small{color:var(--dim);font-size:12.5px;display:block}
.bar5{height:6px;border-radius:3px;background:var(--edge);overflow:hidden}.bar5 i{display:block;height:100%;background:var(--accent);border-radius:3px}
.al{font-size:14px;padding:4px 0;color:var(--text)}.al::before{content:'· ';color:var(--accent)}
.gl{display:flex;align-items:center;gap:8px;font-size:14.5px;padding:5px 0}.gl button{margin-inline-start:auto;background:none;border:0;color:var(--dim);cursor:pointer;font-size:18px}
.card.know .q5{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.card.know .q5 .btn{padding:7px 12px;font-size:13.5px}
.card.know .city{flex:1;min-width:150px;background:transparent;border:1px solid var(--line,#2a2f3a);border-radius:10px;color:inherit;font:inherit;font-size:14px;padding:7px 10px;outline:none}
.card.know .meta{color:var(--faint);font-size:12px;margin-top:10px;display:flex;justify-content:space-between;align-items:center}
.card.know .meta button{background:none;border:0;color:var(--dim);cursor:pointer;font-size:12.5px;padding:0}
.panel{width:min(440px,100%);background:#11141b;border:1px solid var(--edge);border-radius:22px 22px 0 0;padding:22px 22px 26px;animation:up .3s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.panel h3{margin:0 0 16px;font-size:17px;font-weight:600}
.opt{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--edge);font-size:15px}
.opt:last-of-type{border:0}
.opt small{display:block;color:var(--dim);font-size:12.5px;margin-top:2px}
.sw{width:46px;height:28px;border-radius:14px;background:var(--faint);position:relative;cursor:pointer;transition:.2s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--accent)}.sw.on::after{left:21px}
.voices{display:flex;gap:6px;flex-wrap:wrap}
.voices .btn{padding:7px 14px;font-size:14px}
.voices .btn.on{background:var(--text);color:#0a0c10}
.panel .links{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.panel .links .btn{font-size:14px;padding:8px 16px}

#intro{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;transition:opacity .9s ease;cursor:pointer}
#intro.out{opacity:0;pointer-events:none;transition:opacity 1.1s ease .25s}
#intro.out .cap2,#intro.out .skip{opacity:0;transition:opacity .4s}
#intro .words{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
#intro .w{font-size:min(8.5vw,34px);font-weight:300;letter-spacing:.06em;white-space:nowrap}
#intro .w span{display:inline-block;opacity:0;filter:blur(8px);transform:translateY(6px);transition:opacity .6s ease,filter .6s ease,transform .6s ease,color .7s ease,text-shadow .7s ease}
#intro .w.in span{opacity:1;filter:none;transform:none}
#intro .w span.cap{font-weight:600}
#intro.lit .w span.cap{color:#bfeaff;text-shadow:0 0 18px rgba(111,211,255,.8)}
#intro.melt .w span:not(.cap){opacity:0;filter:blur(10px);transform:translateY(14px) scale(.9);transition-duration:.7s}
#intro .fly{position:fixed;left:0;top:0;transform-origin:0 0;transition:transform 1s cubic-bezier(.75,0,.2,1);font-weight:600}
#intro .target{position:absolute;left:50%;top:50%;transform:translate(-50%,-62%);display:flex;gap:.08em;font-size:min(26vw,104px);font-weight:600;letter-spacing:.04em;visibility:hidden}
#intro .cap2{position:absolute;left:0;right:0;top:calc(50% + min(10vw,48px));text-align:center;color:var(--dim);font-size:min(2.9vw,13px);letter-spacing:.2em;white-space:nowrap;text-transform:uppercase;opacity:0;transition:opacity 1.2s ease}
#intro.named .cap2{opacity:1}
#intro.named .fly{text-shadow:0 0 34px rgba(111,211,255,.75),0 0 4px #fff;color:#eaf8ff}
#intro .skip{position:absolute;bottom:22px;left:0;right:0;text-align:center;color:var(--faint);font-size:12.5px}

#mapView{position:fixed;inset:0;z-index:20;background:var(--bg);display:none;flex-direction:column;animation:rise .35s ease}
#mapView.show{display:flex}
#mapBox{flex:1;min-height:0}
#mapTop{position:absolute;top:10px;left:12px;right:12px;display:flex;align-items:center;gap:10px;z-index:2;pointer-events:none}
#mapTitle{background:rgba(10,12,18,.82);backdrop-filter:blur(8px);border:1px solid var(--edge);border-radius:999px;padding:8px 16px;font-size:14.5px;pointer-events:auto}
#mapClose{margin-left:auto;pointer-events:auto;background:rgba(10,12,18,.82);backdrop-filter:blur(8px);border:1px solid var(--edge)}
#mapList{max-height:34%;overflow:auto;background:#0c0f15;border-top:1px solid var(--edge);padding:6px 0}
#mapList .it{display:flex;gap:12px;align-items:baseline;padding:9px 18px;cursor:pointer;font-size:14.5px}
#mapList .it:hover{background:var(--glass)}
#mapList .n{flex:none;width:22px;height:22px;border-radius:50%;background:var(--accent);color:#04121a;font-size:12px;font-weight:700;display:grid;place-items:center}
#mapList .d{color:var(--dim);font-size:13px;margin-left:auto;white-space:nowrap}
.maplibregl-ctrl-attrib{background:rgba(10,12,18,.6)!important;color:var(--dim)!important}.maplibregl-ctrl-attrib a{color:var(--dim)!important}
#langPick{position:fixed;inset:0;z-index:60;background:var(--bg);display:none;align-items:center;justify-content:center;padding:24px}
#langPick.show{display:flex;animation:rise .4s ease}
#langPick .lp{width:min(440px,100%);text-align:center}
#langPick .lpOrb{width:90px;height:90px;margin:0 auto 20px;border-radius:50%;background:radial-gradient(circle,#bfeaff 0,#3aa8e0 35%,rgba(60,120,255,.15) 65%,transparent 72%);animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.1);opacity:.75}}
#langPick h2{font-weight:400;font-size:19px;color:var(--dim);margin:0 0 20px;min-height:26px;transition:opacity .4s}
.lpGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lpGrid .btn{padding:14px 10px;font-size:16px;border-radius:14px}
.lpGrid .btn.sug{border-color:rgba(111,211,255,.55);box-shadow:0 0 0 1px rgba(111,211,255,.25)}
#intro{direction:ltr}
[dir=rtl] .q,[dir=rtl] .a,[dir=rtl] .card{text-align:right}
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div id="intro" style="display:none"><div class="words"></div><div class="target"></div>
<div class="cap2"></div><div class="skip" data-i="skip"></div></div>
<div id="langPick"><div class="lp"><div class="lpOrb"></div><h2></h2><div class="lpGrid" id="lpGrid"></div></div></div>

<div class="top">
  <button class="icon" id="bMute" data-it="mic" title=""><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/><path id="muteSlash" d="M4 4l16 16" style="display:none"/></svg></button>
  <button class="icon" id="bGear" data-it="settings" title=""><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
</div>

<div id="stage">
  <div id="orb" data-it="orbTitle"></div>
  <div id="status" data-i="waking"></div>
  <div id="hint"></div>
</div>
<div id="feed"></div>

<div id="mapView"><div id="mapTop"><div id="mapTitle"></div><button class="icon" id="mapClose" data-it="closeMap" title="">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
<div id="mapBox"></div><div id="mapList"></div></div>
<div id="undo"><span id="undoText" data-i="done"></span><button class="btn" id="bUndo" data-i="undo"></button></div>

<form id="f"><div class="bar">
  <input id="t" data-ip="ph" autocomplete="off">
  <button id="send" type="submit" title="Отправить"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
</div></form>

<div id="sheet"><div class="panel">
  <h3 data-i="settings"></h3>
  <div class="opt"><div data-i="language"></div></div>
  <div class="voices" id="langs"></div>
  <div class="opt" id="voiceOpt" style="margin-top:8px"><div><span data-i="voice"></span><small data-i="voiceSub"></small></div></div>
  <div class="voices" id="voices">
    <button class="btn" data-v="dmitri">Дмитрий</button><button class="btn" data-v="ruslan">Руслан</button>
    <button class="btn" data-v="denis">Денис</button><button class="btn" data-v="irina">Ирина</button>
  </div>
  <div class="opt" style="margin-top:8px"><div><span data-i="speak"></span><small data-i="speakSub"></small></div><div class="sw" id="swTts"></div></div>
  <div class="opt"><div><span data-i="listen"></span><small data-i="listenSub"></small></div><div class="sw" id="swMic"></div></div>
  <div class="links">
    <button class="btn" id="bNew" data-i="restart"></button>
    <button class="btn" id="bMe"></button>
    <button class="btn" id="bMeet" data-i="meet"></button>
    <button class="btn" id="bPro" data-i="pro"></button>
    <button class="btn main" id="bClose" data-i="ok"></button>
  </div>
</div></div>

<div id="meSheet"><div class="panel" id="mePanel"></div></div>
<script src="/i18n.js"></script>
<script src="/know.js"></script>
<script>
const $=s=>document.querySelector(s), feed=$('#feed');
const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
let st={}, busy=false, ex=null, wsOk=false, voice='off', speaking=false, micWanted=true, changedFiles=false;

// ─── язык интерфейса ───
let lang='ru',UI=I18N.ru,K=KNOW.ru;
const langInfo=c=>LANGS.find(l=>l.code===c)||LANGS[0];
function applyLang(code){
  lang=I18N[code]?code:'ru';UI=I18N[lang];const li=langInfo(lang);
  document.documentElement.lang=lang;document.documentElement.dir=li.rtl?'rtl':'ltr';document.title=UI.name;
  document.querySelectorAll('[data-i]').forEach(e=>e.textContent=UI[e.dataset.i]);
  document.querySelectorAll('[data-it]').forEach(e=>e.title=UI[e.dataset.it]);
  document.querySelectorAll('[data-ip]').forEach(e=>e.placeholder=UI[e.dataset.ip]);
  K=KNOW[lang]||KNOW.en;$('#bMe').textContent=K.me;
  $('#hint').textContent=UI.hints[0];$('#voiceOpt').style.display=$('#voices').style.display=li.speech==='ru'?'':'none';
  if(typeof map!=='undefined'&&map){map.remove();map=null;mapReady=null}
  if(typeof paintStatus==='function')paintStatus();
}
async function chooseLang(code){
  applyLang(code);try{localStorage.setItem('russel_lang',code)}catch{}
  await post('/api/lang',{lang:langInfo(code).speech});st.language=langInfo(code).speech;
}
function guessLang(){
  const n=(navigator.language||'ru').toLowerCase();
  if(/^zh-(tw|hk|mo)|hant/.test(n))return 'zh-Hant';
  const c=n.split('-')[0];return I18N[c]?c:(['uk','be','kk','ky','uz','tg','hy','az','ka','tk','mn'].includes(c)?'ru':'en');
}
function pickLang(){
  return new Promise(done=>{const g=$('#lpGrid'),sug=guessLang();$('#langPick').classList.add('show');
    g.innerHTML=LANGS.map(l=>`<button class="btn${l.code===sug?' sug':''}" data-c="${l.code}" dir="auto">${l.native}</button>`).join('');
    const titles=LANGS.map(l=>I18N[l.code].pick);let k=0;const h=$('#langPick h2');h.textContent=I18N[sug].pick;
    const iv=setInterval(()=>{k=(k+1)%titles.length;h.style.opacity=0;setTimeout(()=>{h.textContent=titles[k];h.style.opacity=1},400)},2200);
    g.querySelectorAll('.btn').forEach(b=>b.onclick=async()=>{clearInterval(iv);await chooseLang(b.dataset.c);$('#langPick').classList.remove('show');done()})});
}
const CHANGES=new Set(['organize_folder','move_files','make_folder','write_file','delete_files','apply_sort_plan']);
const base=p=>String(p||'').split(/[\\/]/).filter(Boolean).pop()||p;
const list=a=>{a=(a||[]).map(base);return a.length>3?a.slice(0,3).join(', ')+UI.more(a.length-3):a.join(', ')};
function ask(e){            // вопрос подтверждения — обычными словами, на языке пользователя
  const a=e.args||{},f=UI.ask[e.tool];
  return f?f(a,base,list):(e.description||'').split(/[.\n]/)[0]+'?';
}
function detail(e){const a=e.args||{};
  if(e.tool==='move_files')return (a.moves||[]).slice(0,6).map(m=>`${base(m.src)} → ${m.dst}`).join('\n');
  if(e.tool==='write_file')return String(a.content||'').slice(0,300);
  if(e.tool==='run_powershell')return a.command;
  if(e.tool==='delete_files'&&(a.paths||[]).length>3)return (a.paths||[]).map(base).join('\n');
  return '';}

// ─── лента ───
function newEx(q,src){
  feed.querySelectorAll('.ex').forEach(x=>x.classList.add('old'));
  ex=document.createElement('div');ex.className='ex';
  ex.innerHTML=(q?`<div class="q">${src==='voice'?'<span class="mic">🎙</span>':''}${esc(q)}</div>`:'')+'<div class="acts"></div><div class="a"></div>';
  feed.appendChild(ex);document.body.classList.add('talking');down();return ex}
const down=()=>requestAnimationFrame(()=>feed.scrollTop=feed.scrollHeight);
const cur=()=>ex||newEx('');
function act(tool){const d=document.createElement('div');d.className='act';d.dataset.tool=tool;d.textContent=(UI.act[tool]||UI.working)+'…';cur().querySelector('.acts').appendChild(d);setStatus(d.textContent);down()}
function note(t){const d=document.createElement('div');d.className='note';d.textContent=t;cur().appendChild(d);down()}

function onEvent(e){
  switch(e.type){
    case 'user': newEx(e.text,e.source);setBusy(true);changedFiles=false;setStatus(UI.thinking);break;
    case 'token': {const a=cur().querySelector('.a');a.textContent+=e.text;down();break}
    case 'tool_start': act(e.tool);break;
    case 'tool_end': {const ds=[...cur().querySelectorAll('.act')].filter(x=>x.dataset.tool===e.tool&&!x.classList.contains('done'));
      const d=ds[0];if(d){d.classList.add('done');d.textContent=(UI.act[e.tool]||UI.working)+(e.ok===false?UI.failed:'')}

    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const src=ctx.createMediaStreamSource(stream),proc=ctx.createScriptProcessor(2048,1,1),ratio=ctx.sampleRate/16000;
    const m={stream,ctx,proc,ws:null};
    const open=()=>{if(mic!==m)return;m.ws=new WebSocket(`ws://${location.host}/ws/audio`);m.ws.binaryType='arraybuffer';m.ws.onmessage=x=>{try{const h=JSON.parse(x.data);if(h.type==='hello')audioId=h.id}catch{}};m.ws.onclose=()=>setTimeout(open,1500)};
    proc.onaudioprocess=e=>{
      const f=e.inputBuffer.getChannelData(0);let s2=0;for(let i=0;i<f.length;i+=4)s2+=f[i]*f[i];micLevel=Math.sqrt(s2/(f.length/4));

      const r=()=>{ctx.resume();ensureOut();voice='idle';paintStatus();document.removeEventListener('pointerdown',r);document.removeEventListener('keydown',r)};
      document.addEventListener('pointerdown',r);document.addEventListener('keydown',r)}
  }catch(err){

      c.querySelector('button').onclick=()=>{c.remove();startMic()};cur().appendChild(c)}}
}

const cv=$('#sky'),g=cv.getContext('2d'),hit=$('#orb');let E=0,T=0,hue=195;

  const b=hit.getBoundingClientRect(),cx=b.left+b.width/2,cy=b.top+b.height/2,R=b.width*.26*(1+E*.4);
  const glow=g.createRadialGradient(cx,cy,R*.2,cx,cy,R*(2.6+E));
  glow.addColorStop(0,`hsla(${hue},${sat}%,60%,${.18+E*.25})`);glow.addColorStop(.5,`hsla(${hue},${sat}%,50%,${.05+E*.08})`);glow.addColorStop(1,`hsla(${hue},${sat}%,50%,0)`);g.fillStyle=glow;g.fillRect(0,0,w,h);
  g.globalCompositeOperation='lighter';
  for(let i=0;i<5;i++){
    const a=T*(.7+i*.23)+i*1.26,r=R*(.18+.14*Math.sin(T*1.3+i))*(1+E*.8);
    const x=cx+Math.cos(a)*r,y=cy+Math.sin(a*1.17)*r,rr=R*(.62+.12*Math.sin(T*2+i*2));
    const gr=g.createRadialGradient(x,y,0,x,y,rr);
    gr.addColorStop(0,`hsla(${hue+i*14-28},${sat}%,${62+E*20}%,${.55})`);gr.addColorStop(1,`hsla(${hue+i*14-28},${sat}%,50%,0)`);
    g.fillStyle=gr;g.beginPath();g.arc(x,y,rr,0,7);g.fill()}
  const core=g.createRadialGradient(cx,cy,0,cx,cy,R*.55);
  core.addColorStop(0,`hsla(${hue},40%,96%,${.35+E*.5})`);core.addColorStop(1,'transparent');g.fillStyle=core;g.beginPath();g.arc(cx,cy,R*.6,0,7);g.fill();
  g.globalCompositeOperation='source-over';
  requestAnimationFrame(frame)}
requestAnimationFrame(frame);

// ─── связь с Russel ───
async function refresh(){try{st=await (await fetch('/api/state')).json();voice=st.voice;setBusy(st.busy);return true}catch{return false}}
function connect(){
  const ws=new WebSocket(`ws://${location.host}/ws`);
  ws.onmessage=m=>onEvent(JSON.parse(m.data));
  ws.onopen=()=>{wsOk=true;refresh().then(paintStatus)};
  ws.onclose=()=>{wsOk=false;paintStatus();setTimeout(connect,1500)};
}
try{applyLang(localStorage.getItem('russel_lang')||'ru')}catch{applyLang('ru')}
(async()=>{
  while(!(await refresh()))await new Promise(r=>setTimeout(r,800));
  const log=(st.log||[]).filter(e=>['user','final'].includes(e.type)).slice(-6);
  log.forEach(onEvent);feed.querySelectorAll('.ex').forEach(x=>x.classList.add('old'));
  if(st.pending)confirmCard({...st.pending});
  connect();
  try{micWanted=localStorage.getItem('russel_mute')!=='1'}catch{}
  $('#bMute').classList.toggle('off',!micWanted);$('#muteSlash').style.display=micWanted?'none':'';
  if(micWanted)startMic();
  let saved=null,met=false;try{saved=localStorage.getItem('russel_lang');met=localStorage.getItem('russel_met')==='1'}catch{}
  if(!saved){await pickLang();met=false}
  if(!met||location.hash==='#intro')playIntro();
})();

// ─── знакомство: шесть слов собираются в РАССЕЛ ───
function playIntro(){
  const box=$('#intro'),words=box.querySelector('.words'),target=box.querySelector('.target');
  box.className='';box.style.display='flex';words.innerHTML='';target.innerHTML='';box.querySelectorAll('.fly').forEach(x=>x.remove());
  const caps=[];
  box.querySelector('.cap2').textContent=UI.introCaption;
  UI.introWords.forEach(w=>{const d=document.createElement('div');d.className='w';
    [...w].forEach((ch,i)=>{const s=document.createElement('span');s.textContent=ch;if(!i){s.className='cap';caps.push(s)}d.appendChild(s)});words.appendChild(d)});
  UI.introWords.map(w=>w[0].toUpperCase()).forEach(ch=>{const s=document.createElement('span');s.textContent=ch;target.appendChild(s)});
  const timers=[],at=(ms,f)=>timers.push(setTimeout(f,ms));
  let done=false;const finish=()=>{if(done)return;done=true;timers.forEach(clearTimeout);
    const o=$('#orb').getBoundingClientRect(),ox=o.left+o.width/2,oy=o.top+o.height/2;      // буквы втягиваются в шар
    box.querySelectorAll('.fly').forEach((f,i)=>{const r=f.getBoundingClientRect();f.style.transition='transform .9s cubic-bezier(.6,0,.3,1),opacity .9s ease';
      f.style.transitionDelay=(i*40)+'ms';f.style.transform=`translate(${ox-r.width*.06}px,${oy-r.height*.06}px) scale(.12)`;f.style.opacity='0'});
    box.classList.add('out');
    setTimeout(()=>{box.style.display='none';box.className=''},950);try{localStorage.setItem('russel_met','1')}catch{}};
  box.onclick=finish;
  [...words.children].forEach((d,i)=>at(250+i*380,()=>{[...d.children].forEach((s,j)=>s.style.transitionDelay=(j*28)+'ms');d.classList.add('in')}));
  at(2000,()=>{words.querySelectorAll('span').forEach(s=>s.style.transitionDelay='0ms');box.classList.add('lit')});
  at(2700,()=>box.classList.add('melt'));
  at(3150,()=>{const tg=[...target.children];
    caps.forEach((c,i)=>{const a=c.getBoundingClientRect(),b=tg[i].getBoundingClientRect(),k=b.height/a.height;
      const f=c.cloneNode(true);f.className='fly';f.style.font=getComputedStyle(c).font;f.style.color='#bfeaff';
      f.style.transform=`translate(${a.left}px,${a.top}px)`;box.appendChild(f);c.style.visibility='hidden';
      requestAnimationFrame(()=>requestAnimationFrame(()=>{f.style.transitionDelay=(i*70)+'ms';f.style.transform=`translate(${b.left}px,${b.top}px) scale(${k})`}))})});
  at(4450,()=>{box.classList.add('named');post('/api/greet')});
  at(7600,finish);
}
</script>
